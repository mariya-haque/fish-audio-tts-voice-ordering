<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fish Audio Text to Speech</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #262d38;
    --fg: #e6edf3; --dim: #8b949e;
    --accent: #4493f8; --ok: #3fb950; --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 760px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 19px; margin: 0; font-weight: 600; }
  #meta { color: var(--dim); font-size: 12.5px; font-family: ui-monospace, monospace; }

  .status { font-size: 13px; color: var(--dim); margin: 10px 0 14px; height: 18px; }
  .status.ok   { color: var(--ok); }
  .status.warn { color: var(--warn); }
  .status.err  { color: var(--err); }
  .status.live { color: var(--accent); }

  #transcript {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; height: 400px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
  }
  #transcript:empty::after {
    content: "Type something below and press Enter.";
    color: var(--dim); font-size: 13.5px; margin: auto;
  }
  .bubble { padding: 9px 13px; border-radius: 12px; max-width: 82%; white-space: pre-wrap; }
  .bubble.user { align-self: flex-end; background: #1f3a5f; border-bottom-right-radius: 4px; }
  .bubble.assistant { align-self: flex-start; background: #21262d; border-bottom-left-radius: 4px; }

  #latency {
    font-family: ui-monospace, monospace; font-size: 12px; color: var(--dim);
    margin: 10px 0; min-height: 16px;
  }

  #composer { display: flex; gap: 8px; align-items: flex-end; }
  #text-input {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 13px; color: var(--fg); font-size: 14px;
    font-family: inherit; resize: vertical; min-height: 44px; max-height: 160px;
  }
  #text-input:focus { outline: none; border-color: var(--accent); }

  button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 16px; font-size: 14px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #3d4653; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }

  .row { display: flex; gap: 14px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  label.toggle { display: flex; align-items: center; gap: 7px; font-size: 13.5px; cursor: pointer; }
  #mode-hint { color: var(--dim); font-size: 12.5px; }

  .diag {
    font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--dim);
  }
  .unblock {
    margin-top: 12px; width: 100%; text-align: center;
    background: var(--warn); border-color: var(--warn); color: #1a1200; font-weight: 600;
  }

  details { margin-top: 18px; }
  summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  #log {
    margin-top: 8px; height: 120px; overflow-y: auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px;
    font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--dim);
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Fish Audio Text to Speech</h1>
    <span id="meta">connecting…</span>
  </header>

  <div id="status" class="status">connecting…</div>

  <div id="transcript"></div>
  <div id="latency"></div>

  <form id="composer" autocomplete="off">
    <textarea id="text-input" rows="1"
      placeholder="Type here, press Enter to send (Shift+Enter for a new line)"></textarea>
    <button type="submit" class="primary">Send</button>
  </form>

  <div class="row">
    <label class="toggle">
      <input type="checkbox" id="verbatim" />
      Speak my text verbatim
    </label>
    <span id="mode-hint">The assistant answers, and the answer is spoken as it is written.</span>
  </div>

  <div class="row">
    <button id="stop" disabled>Stop speaking</button>
    <button id="reset">Clear</button>
    <button id="testtone">Test sound</button>
    <span id="audio-info" class="diag"></span>
  </div>

  <button id="unblock" class="unblock" hidden>
    Enable sound — your browser is blocking audio until you click
  </button>

  <details>
    <summary>Log</summary>
    <div id="log"></div>
  </details>
</main>
<script src="app.js"></script>
</body>
</html>
