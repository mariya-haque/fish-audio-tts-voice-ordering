<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordering</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --line: #262d38;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #4493f8;
    --good: #3fb950;
    --bad: #f85149;
    --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #restaurant { color: var(--muted); font-size: 13px; }
  #status {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  #dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex: none;
  }
  #dot.live { background: var(--good); }
  #dot.error { background: var(--bad); }

  main { display: flex; flex: 1; min-height: 0; }

  #left { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #transcript {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .bubble {
    max-width: 78%; padding: 9px 13px; border-radius: 12px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .bubble.user { align-self: flex-end; background: #1f6feb; }
  .bubble.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .bubble.pending { opacity: 0.65; }
  .event {
    align-self: center; font-size: 12px; color: var(--muted);
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .event.err { color: var(--bad); }

  #composer {
    display: flex; gap: 10px; align-items: center;
    padding: 14px 20px; border-top: 1px solid var(--line); background: var(--panel);
  }
  button {
    font: inherit; padding: 9px 16px; border-radius: 8px;
    border: 1px solid var(--line); background: #21262d; color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  #text {
    flex: 1; font: inherit; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  #text:focus { outline: none; border-color: var(--accent); }
  #unblock { display: none; border-color: var(--warn); color: var(--warn); }
  #talk { font-weight: 600; min-width: 120px; user-select: none; touch-action: none; }
  #talk.on { background: var(--bad); border-color: var(--bad); }
  #level {
    width: 52px; height: 5px; border-radius: 3px; background: var(--line);
    overflow: hidden; flex: none;
  }
  #level > div { height: 100%; width: 0%; background: var(--good); transition: width 80ms; }
  #latency {
    padding: 0 20px 12px; background: var(--panel); color: var(--muted);
    font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace;
    min-height: 16px;
  }

  #right {
    width: 330px; flex: none; border-left: 1px solid var(--line);
    background: var(--panel); display: flex; flex-direction: column;
  }
  #right h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 0; padding: 16px 18px 10px;
  }
  #lines { flex: 1; overflow-y: auto; padding: 0 18px; }
  .line { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .line .qty { color: var(--muted); }
  .line .opts { color: var(--muted); font-size: 12.5px; }
  .line .amt { float: right; font-variant-numeric: tabular-nums; }
  #empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  #totals { padding: 14px 18px; border-top: 1px solid var(--line); font-size: 14px; }
  #totals .row { display: flex; justify-content: space-between; padding: 3px 0; }
  #totals .row.total { font-weight: 600; font-size: 16px; padding-top: 8px; }
  #totals .row span:last-child { font-variant-numeric: tabular-nums; }
  #needed { color: var(--warn); font-size: 13px; padding: 10px 18px 0; }
  #placed {
    margin: 12px 18px; padding: 10px 12px; border-radius: 8px;
    background: rgba(63,185,80,0.12); border: 1px solid var(--good);
    color: var(--good); font-size: 13px; display: none;
  }
</style>
</head>
<body>
  <header>
    <h1>Ordering</h1>
    <span id="restaurant"></span>
    <span id="status"><span id="dot"></span><span id="statustext">connecting</span></span>
  </header>

  <main>
    <div id="left">
      <div id="transcript"></div>
      <div id="composer">
        <button id="talk" disabled title="Hold to talk">Hold to talk</button>
        <div id="level"><div></div></div>
        <button id="unblock">Enable sound</button>
        <input id="text" placeholder="…or type your order here" autocomplete="off" disabled>
        <button id="stop" disabled>Stop</button>
        <button id="reset">Reset</button>
      </div>
      <div id="latency"></div>
    </div>

    <div id="right">
      <h2>Order</h2>
      <div id="lines"><div id="empty">Nothing yet.</div></div>
      <div id="placed"></div>
      <div id="needed"></div>
      <div id="totals"></div>
    </div>
  </main>

  <script src="order.js"></script>
</body>
</html>
